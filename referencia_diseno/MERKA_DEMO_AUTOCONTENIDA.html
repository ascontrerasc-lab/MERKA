function addCart(id){let p=byId(id);if(!p)return;if(!s.selection.size&&p.sizes?.length>1){msg('Selecciona una talla');return}if(!s.selection.color&&p.colors?.length>1){msg('Selecciona un color');return}let size=s.selection.size||p.sizes?.[0]||'Única',color=s.selection.color||p.colors?.[0]||'Único',q=Math.max(1,s.qty);let exists=s.cart.find(i=>i.id===id&&i.size===size&&i.color===color);let current=s.cart.filter(i=>i.id===id).reduce((sum,i)=>sum+i.qty,0);if(current+q>p.stock){msg('La cantidad supera el stock de demostración');return}if(exists)exists.qty+=q;else s.cart.push({id,size,color,qty:q,bulkMode:s.mode==='b2b'});save();open('canasta');msg('Producto agregado a tu bolsa')}

function profile(){let modes=[['buyer','bag','Comprar para mí','Explora productos y compra',true],['b2b','store','Comprar por mayor','Abastece tu negocio',!!s.b2bProfile],['seller','tag','Vender','Administra tu tienda',!!s.sellerApproved],['driver','truck','Repartir','Gestiona tus entregas',!!s.driverApproved]];return `<div class="content"><div class="panel-card soft"><div class="row"><div class="avatar">${esc((s.self.name||'M')[0]).toUpperCase()}</div><div class="stretch"><b style="font-size:14px">${esc(s.self.name)}</b><div class="micro">${esc(s.self.email||'Cuenta de demostración')}</div></div><span class="pill">Demo</span></div><p class="muted">Una sola cuenta para acceder a distintas experiencias MERKA.</p><button class="text-link" onclick="M.open('mensajes')">${ico('mail')} Centro de mensajes (demo)</button></div><div class="section-h"><h2>Elige tu modo MERKA</h2><small>Desde tu perfil</small></div><div class="mode-grid">${modes.map(([id,icon,name,desc,active])=>`<button class="mode-card ${s.mode===id?'selected':''}" onclick="M.pickMode('${id}')">${ico(icon)}<b>${name}</b><small>${desc}</small><span class="pill ${active?'green':'grey'}">${s.mode===id?'Modo actual':active?'Habilitado':'Activar'}</span></button>`).join('')}</div><div class="section-h"><h2>Mi cuenta</h2></div><div class="panel-card"><div class="action-row">${ico('heart')}<button onclick="M.favorites()">Mis favoritos (${s.favorites.length})</button>${ico('arrow')}</div><div class="action-row">${ico('orders')}<button onclick="M.open('pedidos')">Mis pedidos (${s.orders.length})</button>${ico('arrow')}</div><div class="action-row">${ico('magic')}<button onclick="M.open('virtual')">Prueba virtual con IA</button>${ico('arrow')}</div><div class="action-row">${ico('shield')}<button onclick="M.open('admin')">Centro de control · solo demostración</button>${ico('arrow')}</div></div><p class="micro" style="margin-top:13px">En la aplicación real, los cambios de permisos y la aprobación de cuentas deben verificarse en Firebase; estos controles locales solo muestran el recorrido visual.</p>${button('Reiniciar datos de demostración',"M.reset()",'secondary full')}</div>`}
function pickMode(mode){if(mode==='buyer'||(mode==='b2b'&&s.b2bProfile)||(mode==='seller'&&s.sellerApproved)||(mode==='driver'&&s.driverApproved)){s.mode=mode;s.category='Todos';s.query='';open(mode==='seller'?'panel':mode==='driver'?'driver':'inicio');return} s.pendingMode=mode;open('activar')}
function activate(){let m=s.pendingMode||'seller',isSeller=m==='seller',isDriver=m==='driver',heading=isSeller?'Registra tu tienda':isDriver?'Registro de motorizado':'Activa tu modo mayorista',fields=isSeller?`<div class="field"><label>Nombre comercial *</label><input name="name" required placeholder="Ej. Mi Tienda de Gamarra" value="${esc(s.sellerStore?.name)}"></div><div class="field"><label>Nombre del responsable *</label><input name="responsible" required placeholder="Nombres y apellidos"></div><div class="field"><label>WhatsApp *</label><input name="phone" required inputmode="tel" minlength="9" placeholder="999 999 999"></div><div class="fields2"><div class="field"><label>RUC (opcional)</label><input name="ruc" inputmode="numeric" maxlength="11" placeholder="RUC"></div><div class="field"><label>Categoría principal</label><select name="category"><option>Moda mujer</option><option>Moda hombre</option><option>Moda infantil</option><option>Calzado</option><option>Accesorios</option></select></div></div><div class="field"><label>Dirección de tienda *</label><input name="address" required placeholder="Galería, puesto y zona"></div><div class="field"><label>Descripción</label><textarea name="description" placeholder="Cuéntanos qué vende tu tienda"></textarea></div>`:isDriver?`<div class="field"><label>Nombre completo *</label><input name="name" required></div><div class="fields2"><div class="field"><label>DNI *</label><input name="dni" pattern="[0-9]{8}" maxlength="8" required inputmode="numeric"></div><div class="field"><label>Celular *</label><input name="phone" required minlength="9" inputmode="tel"></div></div><div class="fields2"><div class="field"><label>Vehículo</label><select name="vehicle"><option>Moto</option><option>Bicicleta</option><option>Auto</option></select></div><div class="field"><label>Placa (si aplica)</label><input name="plate"></div></div><div class="field"><label>Distrito donde repartes *</label><input name="zone" required placeholder="Ej. La Victoria"></div>`:`<div class="field"><label>Responsable de la compra *</label><input name="name" required></div><div class="field"><label>Nombre comercial *</label><input name="business" required></div><div class="fields2"><div class="field"><label>Tipo de comprador</label><select name="type"><option>Revendedor</option><option>Dueño de tienda</option><option>Emprendedor</option><option>Comprador empresarial</option></select></div><div class="field"><label>RUC (opcional)</label><input name="ruc" maxlength="11"></div></div><div class="field"><label>WhatsApp *</label><input name="phone" required minlength="9" inputmode="tel"></div><div class="field"><label>Ciudad / distrito *</label><input name="location" required></div><div class="field"><label>Intereses de compra</label><textarea name="interests" placeholder="Ej. vestidos, polos, casacas"></textarea></div>`;
 const pending=isSeller&&s.sellerStore&&!s.sellerApproved||isDriver&&s.driverProfile&&!s.driverApproved;
 return `<div class="content"><button class="text-link" onclick="M.open('perfil')">${ico('back')} Volver al perfil</button><div class="eyebrow">MERKA · Activación de modo</div><h1 class="h1">${heading}</h1><p class="muted">Usa una misma cuenta con un registro específico para cada modalidad. Usa exclusivamente datos ficticios. Los datos se guardan solo en este navegador.</p>${pending?`<div class="panel-card pink"><span class="pill pink">En revisión · demo</span><h3 style="margin-top:12px">Registro recibido</h3><p class="muted">En producción, MERKA validará la documentación antes de habilitar el acceso.</p>${button('Simular aprobación (solo demo)',`M.approve('${m}')`,'full')}${button('Volver al perfil',"M.open('perfil')",'secondary full')}</div>`:`<form id="activateForm" onsubmit="M.submitActivation(event,'${m}')">${fields}<label class="row" style="font-size:11px;margin:15px 0"><input type="checkbox" required style="accent-color:#b77e8d"> Confirmo que los datos corresponden a una solicitud de demostración.</label>${button('Enviar registro de prueba',"document.getElementById('activateForm').requestSubmit()",'full')}</form>`}<div class="notice" style="margin-top:14px">Los documentos reales, RUC, DNI y validaciones deben gestionarse en un servidor seguro. Este formulario no transmite información a MERKA.</div></div>`;
}
function submitActivation(e,mode){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());if(mode==='seller'){s.sellerStore={name:f.name,responsible:f.responsible,phone:f.phone,ruc:f.ruc,address:f.address,category:f.category,description:f.description};s.sellerApproved=false}else if(mode==='driver'){s.driverProfile=f;s.driverApproved=false}else{s.b2bProfile=f;s.mode='b2b';}save();open(mode==='b2b'?'inicio':'activar');msg(mode==='b2b'?'Modo mayorista activado (demo)':'Solicitud de prueba enviada');}
function approve(mode){if(mode==='seller')s.sellerApproved=true;else s.driverApproved=true;s.mode=mode;save();open(mode==='seller'?'panel':'driver');msg('Aprobación simulada; no otorga permisos reales');}
function sellerPanel(){if(!s.sellerApproved)return `<div class="content">${empty('shield','Activa tu tienda','Completa primero el registro del vendedor.')}${button('Ir a mi perfil',"M.open('perfil')",'full')}</div>`;let mine=s.sellerProducts,orders=ordersForSeller();return `<div class="content"><div class="eyebrow">MODO VENDEDOR</div><h1 class="h1">Hola, ${esc(s.sellerStore?.responsible?.split(' ')[0]||'comerciante')}</h1><p class="muted">${esc(s.sellerStore?.name)} · Tu negocio en un mismo lugar.</p><div class="stat-grid"><div class="stat-card"><span class="micro">Productos publicados</span><strong>${mine.length}</strong><small>Catálogo local</small></div><div class="stat-card"><span class="micro">Pedidos recibidos</span><strong>${orders.length}</strong><small>De demostración</small></div><div class="stat-card"><span class="micro">Unidades en stock</span><strong>${mine.reduce((a,p)=>a+p.stock,0)}</strong><small>Inventario de prueba</small></div><div class="stat-card"><span class="micro">Lives programados</span><strong>${s.liveEvents.length}</strong><small>No transmiten realmente</small></div></div><div class="section-h"><h2>Gestiona tu tienda</h2></div><div class="panel-card"><div class="action-row">${ico('plus')}<button onclick="M.open('nuevo')">Publicar un producto</button>${ico('arrow')}</div><div class="action-row">${ico('box')}<button onclick="M.open('inventario')">Control de inventario</button>${ico('arrow')}</div><div class="action-row">${ico('video')}<button onclick="M.open('videoNew')">Subir video de producto</button>${ico('arrow')}</div><div class="action-row">${ico('live')}<button onclick="M.open('sellerlive')">MERKA Live</button>${ico('arrow')}</div><div class="action-row">${ico('orders')}<button onclick="M.open('sellerorders')">Pedidos de mi tienda</button>${ico('arrow')}</div><div class="action-row">${ico('camera')}<button onclick="M.open('studio')">MERKA Studio</button>${ico('arrow')}</div></div><div class="panel-card pink" style="margin-top:13px"><b style="font-size:12px">Tu tienda, en MERKA</b><p class="muted">Desde el catálogo, los clientes pueden descubrir productos y abrir fichas con tallas, colores y precios.</p>${button('Ver mi tienda',"M.shop('my')",'secondary full')}</div></div>`}
function sellerProducts(){return `<div class="content"><div class="row between"><div><div class="eyebrow">Catálogo del vendedor</div><h1 class="h1">Mis productos</h1></div><button class="icon-button" onclick="M.open('nuevo')" aria-label="Nuevo producto">${ico('plus')}</button></div><div class="two-buttons">${button('Publicar producto',"M.open('nuevo')",'full')}${button('Inventario',"M.open('inventario')",'secondary full')}</div>${s.sellerProducts.length?s.sellerProducts.map(p=>`<div class="list-row"><img src="${esc(p.img)}" alt="${esc(p.name)}"><div class="grow"><h3>${esc(p.name)}</h3><p>${esc(p.category)} · Stock ${p.stock}</p><b style="font-size:12px">${soles(p.price)}</b></div><div class="end"><span class="pill green">Publicación demo</span><button class="text-link" onclick="M.removeProduct('${p.id}')">Eliminar</button></div></div>`).join(''):empty('box','Todavía no publicaste productos','Crea tu primer producto o añade contenido de prueba.')+button('Cargar 2 productos ilustrativos',"M.seedSeller()",'secondary full')}</div>`}
function newProduct(){return `<div class="content"><button class="text-link" onclick="M.open('misproductos')">${ico('back')} Volver al catálogo</button><div class="eyebrow">MERKA · Catálogo</div><h1 class="h1">Nuevo producto</h1><p class="muted">Completa los datos que visualizarán los compradores. La publicación es local, no se enviará al marketplace real.</p><form id="productForm" onsubmit="M.publishProduct(event)"><div class="field"><label>Imagen desde tu dispositivo</label><input id="newPhoto" type="file" accept="image/png,image/jpeg,image/webp" onchange="M.photoPreview(this)"><small>La foto se comprimirá para guardar esta demostración en el navegador.</small></div><div id="photoPreview" class="placeholder" style="min-height:120px;border-radius:13px;margin-bottom:13px">Sin imagen seleccionada</div><div class="field"><label>Nombre del producto *</label><input name="name" required placeholder="Ej. Chompa de punto"></div><div class="field"><label>Categoría</label><select name="category"><option>Mujer</option><option>Hombre</option><option>Infantil</option><option>Calzado</option><option>Accesorios</option></select></div><div class="fields2"><div class="field"><label>Precio minorista S/ *</label><input name="price" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Stock *</label><input name="stock" type="number" min="0" step="1" required></div></div><div class="fields2"><div class="field"><label>Precio mayorista S/</label><input name="wholesale" type="number" min="0" step="0.01"></div><div class="field"><label>Mínimo mayorista</label><input name="minWholesale" type="number" min="1" step="1" value="6"></div></div><div class="field"><label>Tallas (separadas por coma)</label><input name="sizes" placeholder="S, M, L" value="S, M, L"></div><div class="field"><label>Colores (separados por coma)</label><input name="colors" placeholder="Beige, Negro"></div><div class="field"><label>Descripción</label><textarea name="desc" placeholder="Material, estilo, características..."></textarea></div>${button('Publicar producto de prueba',"document.getElementById('productForm').requestSubmit()",'full')}</form></div>`}
let latestPhoto=null;
function photoPreview(el){let f=el.files?.[0];if(!f)return;if(f.size>8*1024*1024){msg('Usa una imagen de menos de 8 MB');return}let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,680/im.width,680/im.height),can=document.createElement('canvas');can.width=Math.round(im.width*scale);can.height=Math.round(im.height*scale);can.getContext('2d').drawImage(im,0,0,can.width,can.height);latestPhoto=can.toDataURL('image/jpeg',.66);document.querySelector('#photoPreview').innerHTML=`<img src="${latestPhoto}" alt="Vista previa" style="max-height:190px;max-width:100%;border-radius:13px">`};im.src=reader.result};reader.readAsDataURL(f)}
function publishProduct(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());let price=Number(f.price),stock=Number(f.stock);if(!Number.isFinite(price)||price<=0||!Number.isInteger(stock)||stock<0){msg('Revisa el precio y las unidades');return}let p={id:'own-'+Date.now(),name:f.name.slice(0,90),category:f.category,price,wholesale:Number(f.wholesale)||0,minWholesale:Number(f.minWholesale)||6,stock,storeId:'my',img:latestPhoto||asset('perchero'),ratio:'3/4',desc:f.desc||'Producto de demostración',sizes:f.sizes.split(',').map(v=>v.trim()).filter(Boolean),colors:f.colors.split(',').map(v=>v.trim()).filter(Boolean)};s.sellerProducts.push(p);latestPhoto=null;save();open('misproductos');msg('Producto agregado al catálogo de prueba')}
function seedSeller(){if(!s.sellerStore){msg('Registra primero tu tienda');return}for(let p of [baseProducts[1],baseProducts[7]])s.sellerProducts.push({...p,id:'own-'+Date.now()+Math.random().toString(36).slice(2,5),storeId:'my',name:p.name+' · ejemplo'});save();render();msg('Productos de ejemplo añadidos')}
function removeProduct(id){if(!window.confirm('¿Eliminar este producto del catálogo de demostración?'))return;s.sellerProducts=s.sellerProducts.filter(p=>p.id!==id);s.cart=s.cart.filter(i=>i.id!==id);save();render();msg('Producto eliminado')}
function inventory(){return `<div class="content"><button class="text-link" onclick="M.open('misproductos')">${ico('back')} Volver a productos</button><h1 class="h1">Control de inventario</h1><p class="muted">Ajusta las unidades de tu catálogo. La actualización es local.</p>${s.sellerProducts.length?s.sellerProducts.map(p=>`<div class="list-row"><img src="${esc(p.img)}" alt=""><div class="grow"><h3>${esc(p.name)}</h3><p>Stock disponible</p></div><div class="qty"><button onclick="M.stock('${p.id}',-1)">−</button><span>${p.stock}</span><button onclick="M.stock('${p.id}',1)">+</button></div></div>`).join(''):empty('box','Sin inventario','Publica productos para controlar el stock.')}</div>`}
function ordersForSeller(){return s.orders.filter(o=>o.items.some(i=>byId(i.id)?.storeId==='my'))}
function sellerOrders(){let orders=ordersForSeller();return `<div class="content"><p class="muted">Aquí aparecen pedidos de prueba que incluyan productos publicados desde tu tienda.</p>${orders.length?orders.map(o=>{let status=o.sellerStatuses.my||'pending';return `<div class="panel-card" style="margin:12px 0"><div class="row between"><b style="font-size:12px">${o.id}</b><span class="pill ${status==='ready'?'green':'pink'}">${status==='ready'?'Listo para recojo':o.payment==='pending'?'Pago pendiente':'Por preparar'}</span></div><p class="muted">${o.contact.name} · ${o.contact.district} · ${o.items.filter(x=>byId(x.id)?.storeId==='my').reduce((a,x)=>a+x.qty,0)} artículos</p>${o.payment==='approved'&&status!=='ready'?button('Marcar listo para recojo',`M.sellerReady('${o.id}')`,'full'):''}</div>`}).join(''):empty('orders','Sin pedidos de tu tienda','Para probar el ciclo completo, publica un producto y cómpralo desde el modo Comprador.')}</div>`}
function sellerReady(id){let o=s.orders.find(x=>x.id===id);if(!o||o.payment!=='approved')return msg('Primero se debe confirmar el pago');o.sellerStatuses.my='ready';save();render();msg('Pedido listo para recojo (demo)')}
function sellerLive(){return `<div class="content"><div class="eyebrow">Comercio en vivo</div><h1 class="h1">MERKA Live</h1><p class="muted">Gestiona la presentación de tu tienda y sus productos en tiempo real.</p><div class="panel-card pink"><span class="pill pink">Interfaz de demostración</span><h3 style="margin-top:11px">Programar una transmisión</h3><p class="muted">Este formulario guarda únicamente la programación visual. No inicia ninguna señal real de video.</p><form id="liveForm" onsubmit="M.scheduleLive(event)"><div class="field"><label>Título del Live</label><input name="title" required placeholder="Ej. Nueva colección de tejidos"></div><div class="field"><label>Fecha y hora</label><input name="date" type="datetime-local" required></div><div class="field"><label>Producto a destacar</label><select name="productId"><option value="">Sin producto seleccionado</option>${s.sellerProducts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>${button('Guardar programación de prueba',"document.getElementById('liveForm').requestSubmit()",'full')}</form></div><div class="section-h"><h2>Transmisiones programadas</h2></div>${s.liveEvents.length?s.liveEvents.map(e=>`<div class="panel-card"><b>${esc(e.title)}</b><p class="muted">${esc(e.date)} · Solo planificación</p></div>`).join(''):empty('live','Sin transmisiones programadas','Crea una programación para visualizarla aquí.')}<div class="notice warn" style="margin-top:12px"><strong>Para transmitir realmente:</strong> se necesita integrar Agora con tokens emitidos desde backend, permisos de cámara/micrófono, moderación y gestión de salas. El código anterior se encuentra conservado, sin sustituir su integración.</div></div>`}
function scheduleLive(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());s.liveEvents.push({title:f.title,date:f.date,productId:f.productId});save();render();msg('Programación de prueba guardada')}
function videoNew(){return `<div class="content"><button class="text-link" onclick="M.open('panel')">${ico('back')} Volver al panel</button><h1 class="h1">Video de producto</h1><p class="muted">Los videos grabados de MERKA presentan las prendas y permiten la compra directa, sin comentarios.</p><div class="panel-card"><div class="field"><label>Elige un archivo de video</label><input type="file" accept="video/mp4,video/webm,video/quicktime" onchange="M.previewVideo(this)"></div><div id="videoPreview" class="placeholder">Selecciona un archivo para una vista previa local.</div><div class="field" style="margin-top:13px"><label>Asociar producto</label><select id="videoProduct"><option value="">Selecciona un producto</option>${s.sellerProducts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>${button('Ver ficha del producto',"M.linkVideoProduct()",'secondary full')}<p class="hint">Para publicar videos reales, debes usar Firebase Storage y guardar su relación con el producto. Este archivo no se sube a internet.</p></div></div>`}
function previewVideo(el){let f=el.files?.[0];if(!f)return;if(tempVideoUrl)URL.revokeObjectURL(tempVideoUrl);tempVideoUrl=URL.createObjectURL(f);document.getElementById('videoPreview').innerHTML=`<video controls playsinline src="${tempVideoUrl}" style="width:100%;max-height:320px;border-radius:12px"></video>`}
function linkVideoProduct(){let id=document.getElementById('videoProduct')?.value;if(!id)return msg('Selecciona un producto');detail(id)}
function studio(){return `<div class="content"><button class="text-link" onclick="M.open('panel')">${ico('back')} Volver al panel</button><h1 class="h1">MERKA Studio</h1><p class="muted">Herramientas y recomendaciones para que los comerciantes preparen mejor su contenido audiovisual.</p>${[['camera','Prepara tu espacio','Verifica luz, encuadre y sonido antes de grabar.'],['video','Crea videos comprables','Relaciona cada video con sus productos y variantes.'],['live','Planifica tus Lives','Elige colecciones, títulos y productos destacados.']].map(([ic,t,desc])=>`<div class="panel-card" style="margin:10px 0"><div class="row">${ico(ic)}<b style="font-size:13px">${t}</b></div><p class="muted">${desc}</p></div>`).join('')}${button('Programar MERKA Live',"M.open('sellerlive')",'full')}</div>`}
function driverHome(){let accepted=s.orders.filter(o=>o.driverId==='demo-driver'),ongoing=accepted.filter(o=>o.deliveryStatus!=='delivered');return `<div class="content"><div class="eyebrow">MODO REPARTIR</div><h1 class="h1">Hola, ${esc(s.driverProfile?.name?.split(' ')[0]||'motorizado')}</h1><p class="muted">Consulta entregas disponibles y gestiona tus servicios desde MERKA.</p><div class="panel-card soft"><div class="row between"><div><b style="font-size:13px">Disponible para entregas</b><p class="micro">Zona: ${esc(s.driverProfile?.zone||'Lima')}</p></div><span class="pill green">Cuenta demo habilitada</span></div></div><div class="stat-grid"><div class="stat-card"><span class="micro">Entregas en curso</span><strong>${ongoing.length}</strong><small>Servicios de prueba</small></div><div class="stat-card"><span class="micro">Entregas completadas</span><strong>${accepted.length-ongoing.length}</strong><small>Historial demo</small></div><div class="stat-card"><span class="micro">Solicitudes disponibles</span><strong>${deliverable().length}</strong><small>Pedidos listos</small></div><div class="stat-card"><span class="micro">Ganancias simuladas</span><strong>${soles((accepted.length-ongoing.length)*8)}</strong><small>Tarifa de ejemplo</small></div></div><div class="section-h"><h2>Tu operación</h2></div><div class="panel-card"><div class="action-row">${ico('pin')}<button onclick="M.open('disponibles')">Explorar pedidos disponibles</button>${ico('arrow')}</div><div class="action-row">${ico('truck')}<button onclick="M.open('mistrayectos')">Seguimiento de entregas</button>${ico('arrow')}</div><div class="action-row">${ico('wallet')}<button onclick="M.open('ganancias')">Historial y ganancias</button>${ico('arrow')}</div></div></div>`}
const deliverable=()=>s.orders.filter(o=>o.payment==='approved'&&Object.values(o.sellerStatuses).every(t=>t==='ready')&&!o.driverId);
function availableDeliveries(){return `<div class="content"><div class="eyebrow">Motorizado independiente</div><h1 class="h1">Entregas disponibles</h1><p class="muted">Una entrega aparece disponible cuando el pago fue confirmado y las tiendas marcaron sus productos como listos.</p>${deliverable().length?deliverable().map(o=>`<div class="panel-card" style="margin:11px 0"><div class="row between"><b>${o.id}</b><span class="pill green">Listo para recojo</span></div><p class="muted">${Object.keys(o.sellerStatuses).length} punto(s) de recojo · ${totalItems(o)} unidades</p><p class="row" style="font-size:12px">${ico('pin')} ${esc(o.contact?.district)}, ${esc(o.contact?.city)}</p>${button('Aceptar servicio de prueba',`M.acceptDelivery('${o.id}')`,'full')}</div>`).join(''):empty('truck','Todavía no hay entregas','Los pedidos preparados por las tiendas aparecerán aquí.')}<div class="notice">El seguimiento GPS y la asignación real requieren permisos, servicios de mapas e infraestructura de geolocalización.</div></div>`}
function acceptDelivery(id){let o=deliverable().find(x=>x.id===id);if(!o)return msg('El pedido ya no está disponible');o.driverId='demo-driver';o.deliveryStatus='assigned';save();open('mistrayectos');msg('Entrega asignada en el simulador')}
function myDeliveries(){let mine=s.orders.filter(o=>o.driverId==='demo-driver');return `<div class="content"><div class="eyebrow">Seguimiento de servicios</div><h1 class="h1">Mis entregas</h1>${mine.length?mine.map(o=>`<div class="panel-card" style="margin:11px 0"><div class="row between"><b style="font-size:12px">${o.id}</b><span class="pill ${o.deliveryStatus==='delivered'?'green':'pink'}">${statusLabel(o)}</span></div><div class="list-row"><div>${ico('store')}</div><div class="grow"><h3>Recojo</h3><p>${Object.keys(o.sellerStatuses).map(id=>esc(storeById(id)?.name||'Tienda')).join(' · ')}</p></div></div><div class="list-row"><div>${ico('pin')}</div><div class="grow"><h3>Entrega</h3><p>${esc(o.contact.address)}, ${esc(o.contact.district)}, ${esc(o.contact.city)}</p></div></div>${o.deliveryStatus==='assigned'?button('Confirmar recojo',`M.stepDelivery('${o.id}','pickedup')`,'full'):''}${o.deliveryStatus==='pickedup'?button('Iniciar ruta de entrega',`M.stepDelivery('${o.id}','enroute')`,'full'):''}${o.deliveryStatus==='enroute'?`<div class="field" style="margin-top:13px"><label>Código entregado por el comprador</label><input id="code-${o.id}" inputmode="numeric" maxlength="4" placeholder="Código de 4 dígitos"></div>${button('Confirmar entrega con código',`M.completeDelivery('${o.id}')`,'full')}`:''}${o.deliveryStatus==='delivered'?`<p class="notice">Entrega completada mediante validación del código de prueba.</p>`:''}</div>`).join(''):empty('truck','Sin entregas asignadas','Acepta un pedido disponible para visualizar su recorrido.')}</div>`}
function stepDelivery(id,next){let o=s.orders.find(o=>o.id===id&&o.driverId==='demo-driver');if(!o)return;let permitted={assigned:'pickedup',pickedup:'enroute'};if(permitted[o.deliveryStatus]!==next)return msg('Transición no válida');o.deliveryStatus=next;save();render();msg(next==='pickedup'?'Recojo registrado':'Ruta iniciada')}
function completeDelivery(id){let o=s.orders.find(o=>o.id===id&&o.driverId==='demo-driver');if(!o||o.deliveryStatus!=='enroute')return;let entered=document.getElementById('code-'+id)?.value?.trim();if(entered!==o.code){msg('El código no coincide');return}o.deliveryStatus='delivered';save();render();msg('Entrega confirmada en la simulación')}
function earnings(){let complete=s.orders.filter(o=>o.driverId==='demo-driver'&&o.deliveryStatus==='delivered');return `<div class="content"><div class="eyebrow">Actividad del repartidor</div><h1 class="h1">Mis ganancias</h1><div class="panel-card soft"><p class="micro">Total ilustrativo</p><div class="price">${soles(complete.length*8)}</div><p class="muted">${complete.length} servicios completados · tarifa de demostración S/ 8 por entrega.</p></div><div class="section-h"><h2>Historial de servicios</h2></div>${complete.length?complete.map(o=>`<div class="list-row"><div class="avatar">${ico('check')}</div><div class="grow"><h3>${o.id}</h3><p>${esc(o.contact.district)}</p></div><b>${soles(8)}</b></div>`).join(''):empty('wallet','Sin ganancias registradas','El historial se actualizará al completar una entrega de prueba.')}</div>`}
function admin(){let paid=s.orders.filter(o=>o.payment==='approved'),pending=s.orders.filter(o=>o.payment==='pending');return `<div class="content"><button class="text-link" onclick="M.open('perfil')">${ico('back')} Volver al perfil</button><div class="eyebrow">PROTOTIPO · ADMINISTRACIÓN</div><h1 class="h1">Centro de control</h1><p class="muted">Herramientas de simulación para probar el recorrido entre comprador, vendedor y delivery.</p><div class="notice warn"><strong>No es un panel administrativo seguro.</strong> En producción, estas acciones deben estar restringidas a usuarios autorizados y validadas por servidor. Aquí no se aprueban pagos reales.</div><div class="stat-grid"><div class="stat-card"><span class="micro">Pedidos de prueba</span><strong>${s.orders.length}</strong></div><div class="stat-card"><span class="micro">Pagos simulados aprobados</span><strong>${paid.length}</strong></div></div><div class="section-h"><h2>Validación simulada de pedidos</h2></div>${s.orders.length?s.orders.map(o=>`<div class="panel-card" style="margin:10px 0"><div class="row between"><b style="font-size:12px">${o.id}</b><span class="pill ${o.payment==='pending'?'pink':'green'}">${o.payment==='pending'?'Por confirmar':'Confirmado · demo'}</span></div><p class="muted">${esc(o.contact.name)} · ${soles(o.amount)} · ${Object.keys(o.sellerStatuses).length} tienda(s)</p>${o.payment==='pending'?button('Simular validación de pago',`M.approvePayment('${o.id}')`,'full'):''}${o.payment==='approved'&&!Object.values(o.sellerStatuses).every(v=>v==='ready')?button('Simular preparación de todas las tiendas',`M.allReady('${o.id}')`,'secondary full'):''}<p class="micro">Estado: ${statusLabel(o)}</p></div>`).join(''):empty('orders','No hay órdenes','Compra un producto para generar la primera orden de prueba.')}<div class="section-h"><h2>Revisión de funcionalidades</h2></div><div class="panel-card"><div class="action-row">${ico('shield')}<span class="stretch" style="font-size:12px">Validación de vendedores y repartidores</span><span class="pill pink">Demo</span></div><div class="action-row">${ico('live')}<span class="stretch" style="font-size:12px">Moderación de Live</span><span class="pill grey">Por integrar</span></div><div class="action-row">${ico('chart')}<span class="stretch" style="font-size:12px">Reportes financieros reales</span><span class="pill grey">Por integrar</span></div></div></div>`}
function approvePayment(id){let o=s.orders.find(o=>o.id===id);if(!o||o.payment!=='pending')return;o.payment='approved';for(let k of Object.keys(o.sellerStatuses))o.sellerStatuses[k]='preparing';save();render();msg('Pago aprobado solo dentro de la simulación')}
function allReady(id){let o=s.orders.find(o=>o.id===id);if(!o||o.payment!=='approved')return;for(let k of Object.keys(o.sellerStatuses))o.sellerStatuses[k]='ready';save();render();msg('Tiendas marcadas como listas (demo)')}
function messages(){return `<div class="content"><button class="text-link" onclick="M.open('perfil')">${ico('back')} Volver al perfil</button><h1 class="h1">Mensajes</h1><div class="panel-card soft"><h3>Canal de ayuda</h3><p class="muted">Vista de interfaz para futuras conversaciones entre compradores, vendedores y soporte MERKA.</p><div class="notice">Los mensajes no se envían a otros usuarios en esta versión.</div><div class="field" style="margin-top:14px"><label>Mensaje local de prueba</label><textarea id="messageBox" placeholder="Escribe tu mensaje"></textarea></div>${button('Guardar mensaje de prueba',"M.saveMessage()",'full')}${s.userMessages.map(x=>`<p class="notice" style="margin-top:8px">${esc(x)}</p>`).join('')}</div></div>`}
function saveMessage(){let m=document.getElementById('messageBox')?.value.trim();if(!m)return msg('Escribe un mensaje');s.userMessages.push(m.slice(0,500));save();render();msg('Mensaje guardado solamente en este dispositivo')}
function virtualTry(){return `<div class="content"><button class="text-link" onclick="M.open('inicio')">${ico('back')} Volver a MERKA</button><div class="eyebrow">Innovación proyectada</div><h1 class="h1">Pruébatelo con IA</h1><div class="panel-card pink"><div class="row">${ico('magic')}<b style="font-size:13px">Visualización virtual de prendas</b></div><p class="muted">Esta función permitirá visualizar cómo luce una prenda seleccionada mediante inteligencia artificial, bajo autorización de uso de imagen y políticas de privacidad.</p><p class="notice">No está integrada en este prototipo: no procesamos fotografías personales ni generamos imágenes mediante IA.</p></div><div class="section-h"><h2>Recorrido previsto</h2></div>${['Seleccionar una prenda del catálogo','Autorizar y cargar una fotografía','Generar una vista virtual de la prenda','Revisar resultado y continuar la compra'].map((t,i)=>`<div class="list-row"><span class="pill">${i+1}</span><div class="grow"><h3>${t}</h3></div></div>`).join('')}</div>`}
function favorites(){let list=s.favorites.map(byId).filter(Boolean);return `<div class="content"><button class="text-link" onclick="M.open('perfil')">${ico('back')} Volver al perfil</button><h1 class="h1">Mis favoritos</h1><p class="muted">Prendas guardadas en la demostración.</p></div>${productTiles(list)}`}
function reset(){if(!window.confirm('¿Reiniciar los datos de esta demostración? Se perderán pedidos y registros locales.'))return;localStorage.removeItem(KEY);s=blank();render();msg('Datos de demostración reiniciados')}
function detail(id){if(!byId(id))return; s.selectedProduct=id;open('product')}
function shop(id){s.selectedStore=id;open('storepage')}
function select(key,v){s.selection[key]=v;save();render()}
function changeQty(by){let p=byId(s.selectedProduct);s.qty=Math.max(1,Math.min(Number(p?.stock)||1,s.qty+by));render()}
function setSort(v){s.sort=v;save();render()}
function filter(v){s.query=v;save();const r=document.getElementById('resultTiles'),c=document.getElementById('count');if(r)r.innerHTML=productTiles(filtered());if(c)c.textContent=filtered().length+' productos'}
function stock(id,change){let p=s.sellerProducts.find(p=>p.id===id);if(!p)return;p.stock=Math.max(0,p.stock+change);save();render()}
window.M={open,category:setCat,sort:setSort,filter,detail,shop,favorite,addCart,cartQty,removeCart(i){s.cart.splice(i,1);save();render()},changeQty,select,makeOrder,pickMode,submitActivation,approve,publishProduct,photoPreview,seedSeller,removeProduct,stock,sellerReady,scheduleLive,previewVideo,linkVideoProduct,acceptDelivery,stepDelivery,completeDelivery,approvePayment,allReady,saveMessage,reset,favorites(){s.view='favoritos';save();render()},};
// Register the favorites view in the dispatcher without modifying other screen states.
const previousShell=shell;
shell=function(){if(s.view==='favoritos'){const content=favorites();return `<div class="app-shell no-nav">${header()}<div class="view-scroll" id="scrollarea">${content}</div><div id="toast"></div></div>`}return previousShell()};
render();
})();
</script>
</body>
</html>
