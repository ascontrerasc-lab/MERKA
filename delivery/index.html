<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERKA Delivery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#2B2B2B;--black:#111;--paper:#fff;--cream:#EDE8E1;--sand:#C9BDAF;--gray:#777;--line:#e7e1da;--ok:#e1efe5;--warn:#f6e7d3;--danger:#f5dddd}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f8f6f3;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.shell{max-width:1180px;margin:auto;padding:20px}.brand{font:700 30px 'Playfair Display',serif;letter-spacing:3px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button,.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--black);color:white;font-weight:700}.nav button.alt,.btn.alt{background:var(--cream);color:var(--ink)}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#7a2020}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d8d0c8;border-radius:12px;background:white}.muted{color:var(--gray);font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--cream);font-size:12px}.ok{background:var(--ok)}.warn{background:var(--warn)}.dangerbox{background:var(--danger)}h1,h2,h3{font-family:'Playfair Display',serif}img.prod{width:100%;height:190px;object-fit:cover;border-radius:14px;background:var(--cream)}video{width:100%;max-height:520px;background:#111;border-radius:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:8px 11px;border-radius:10px;background:var(--cream)}.price{font-size:20px;font-weight:700}.notice{padding:12px;border-radius:12px;background:var(--cream);margin:10px 0}.empty{padding:24px;text-align:center;color:var(--gray)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:700px){.two{grid-template-columns:1fr}.shell{padding:12px}.brand{font-size:25px}}
</style></head><body><div class="shell"><div class="brand">MERKA</div><div class="muted">Delivery</div><div id="auth" class="card"><h2>Repartidores</h2><div class="two"><div><h3>Crear cuenta</h3><div class="field"><label>Correo</label><input id="regEmail" type="email"></div><div class="field"><label>Contraseña</label><input id="regPass" type="password"></div><div class="field"><label>Nombre</label><input id="regName"></div><div class="field"><label>Teléfono</label><input id="regPhone"></div><div class="field"><label>Vehículo</label><select id="regVehicle"><option>Moto</option><option>Bicicleta</option><option>Auto</option><option>A pie</option></select></div><button id="register" class="btn">Registrarme</button></div><div><h3>Ingresar</h3><div class="field"><label>Correo</label><input id="email" type="email"></div><div class="field"><label>Contraseña</label><input id="pass" type="password"></div><button id="login" class="btn">Entrar</button></div></div><div id="authMsg" class="notice hide"></div></div><div id="app" class="hide"><div class="top"><h2>Panel Delivery</h2><button id="logout" class="btn light">Cerrar sesión</button></div><div class="card"><div class="space"><div><b>Disponibilidad</b><div id="availText" class="muted"></div></div><div class="row"><button class="btn" data-av="disponible">Disponible</button><button class="btn alt" data-av="no_disponible">No disponible</button></div></div></div><h2>Solicitudes disponibles</h2><div id="available"></div><h2>Mi entrega</h2><div id="mine"></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,updateDoc,collection,query,where,onSnapshot,serverTimestamp,runTransaction}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const firebaseConfig={apiKey:"AIzaSyCfsw2KkgWFGxBRCvnP1cZXCMAfR5BUA34",authDomain:"merka-8a703.firebaseapp.com",projectId:"merka-8a703",storageBucket:"merka-8a703.firebasestorage.app",messagingSenderId:"540198621144",appId:"1:540198621144:web:754ff3b2fe81cbc3372cad"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let uid=null,availableState='no_disponible';function msg(t){$('authMsg').textContent=t;$('authMsg').classList.remove('hide')}$('register').onclick=async()=>{try{let c=await createUserWithEmailAndPassword(auth,$('regEmail').value,$('regPass').value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,role:'delivery',name:$('regName').value,phone:$('regPhone').value,vehicle:$('regVehicle').value,availability:'no_disponible',createdAt:serverTimestamp()})}catch(e){msg(e.message)}};$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('pass').value)}catch(e){msg(e.message)}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(!u){uid=null;$('auth').classList.remove('hide');$('app').classList.add('hide');return}uid=u.uid;let r=await getDoc(doc(db,'users',uid));let profile=r.exists()?r.data():{};let isAdmin=profile.role==='admin'||profile.isAdmin===true||(profile.roles||[]).includes('admin');let isDelivery=profile.role==='delivery'||(profile.roles||[]).includes('delivery');if(!r.exists()||(!isDelivery&&!isAdmin)){msg('Esta cuenta no tiene acceso a Delivery.');await signOut(auth);return}availableState=profile.availability||'no_disponible';$('auth').classList.add('hide');$('app').classList.remove('hide');renderAvail();watchJobs();watchMine()});function renderAvail(){$('availText').textContent=availableState}document.querySelectorAll('[data-av]').forEach(b=>b.onclick=async()=>{availableState=b.dataset.av;await updateDoc(doc(db,'users',uid),{availability:availableState});renderAvail()});
function watchJobs(){onSnapshot(query(collection(db,'orders'),where('deliveryStatus','==','searching_driver')),s=>{$('available').innerHTML=s.docs.length?s.docs.map(d=>{let o=d.data();return`<div class="card"><div class="space"><b>Pedido ${d.id.slice(0,8)}</b><span class="pill">${(o.storeIds||[]).length} punto(s) de recojo</span></div><p>Destino: ${o.shipping?.district||'Distrito por confirmar'}</p><div class="muted">La dirección exacta se muestra después de aceptar.</div><button class="btn" data-accept="${d.id}">Aceptar entrega</button></div>`}).join(''):'<div class="empty">No hay solicitudes disponibles.</div>';document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptJob(b.dataset.accept))})}async function acceptJob(id){if(availableState!=='disponible')return alert('Primero marca tu estado como Disponible.');try{await runTransaction(db,async tx=>{let ref=doc(db,'orders',id),s=await tx.get(ref);if(!s.exists()||s.data().deliveryStatus!=='searching_driver'||s.data().driverId)throw Error('Otro repartidor ya tomó este pedido.');tx.update(ref,{driverId:uid,deliveryStatus:'driver_assigned',driverAssignedAt:serverTimestamp()});tx.update(doc(db,'users',uid),{availability:'ocupado'})});availableState='ocupado';renderAvail()}catch(e){alert(e.message)}}
function watchMine(){onSnapshot(query(collection(db,'orders'),where('driverId','==',uid)),s=>{let jobs=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.deliveryStatus!=='delivered'&&o.deliveryStatus!=='cancelled');$('mine').innerHTML=jobs.length?jobs.map(o=>`<div class="card"><b>Pedido ${o.id.slice(0,8)}</b><p><b>Recojo:</b> ${(o.items||[]).map(i=>i.storeName).filter((v,i,a)=>a.indexOf(v)===i).join(' → ')}</p><p><b>Destino:</b> ${o.shipping?.address||''}, ${o.shipping?.district||''}<br><span class="muted">Ref: ${o.shipping?.reference||''} · Tel: ${o.shipping?.phone||''}</span></p><div class="notice">Estado: ${o.deliveryStatus}</div>${o.deliveryStatus==='driver_assigned'?`<button class="btn" data-pick="${o.id}">Pedido recogido</button>`:''}${o.deliveryStatus==='in_transit'?`<button class="btn" data-arrive="${o.id}">Llegué al destino</button>`:''}${o.deliveryStatus==='arrived_destination'?`<div class="notice"><b>Ya estás en el destino.</b><br><span class="muted">Solicita al comprador su código de 4 dígitos. MERKA no te muestra el código.</span></div><div class="field"><label>Código de entrega</label><input id="code-${o.id}" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn" data-deliver="${o.id}">Validar código y completar entrega</button>`:''}</div>`).join(''):'<div class="empty">No tienes una entrega activa.</div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'orders',b.dataset.pick),{deliveryStatus:'in_transit',status:'in_transit',pickedUpAt:serverTimestamp()}));document.querySelectorAll('[data-arrive]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'orders',b.dataset.arrive),{deliveryStatus:'arrived_destination',arrivedAt:serverTimestamp()}));document.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=async()=>{let entered=$('code-'+b.dataset.deliver).value.trim();if(!/^\d{4}$/.test(entered))return alert('Ingresa el código de 4 dígitos del comprador.');let ref=doc(db,'orders',b.dataset.deliver),snap=await getDoc(ref);if(!snap.exists()||entered!==String(snap.data().deliveryCode||''))return alert('Código incorrecto. Pídeselo al comprador al momento de entregar.');await updateDoc(ref,{deliveryStatus:'delivered',status:'delivered',deliveredAt:serverTimestamp()});await updateDoc(doc(db,'users',uid),{availability:'disponible'});availableState='disponible';renderAvail()})})}
</script></body></html>
